# ============================================================
# iPrep Application Configuration — Groq Free Tier Edition
# ============================================================
spring.application.name=iprep-backend

# --- Server ---
server.port=${PORT:8080}

# --- Database ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# --- SQL Init ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- Multipart (audio uploads for Whisper) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- JWT ---
jwt.secret=${JWT_SECRET:iPrep_Secret_Key_Min_32_Chars_Change_In_Prod!}
jwt.access-token-expiry-ms=86400000

# ============================================================
# GROQ FREE TIER — https://console.groq.com → API Keys
# Free limits (as of 2025):
#   llama-3.3-70b-versatile   : 14,400 requests/day, 500,000 tokens/day
#   whisper-large-v3-turbo    : 7,200 requests/day, 28,800 seconds audio/day
# ============================================================
groq.api.key=${GROQ_API_KEY}
groq.base-url=https://api.groq.com/openai/v1
groq.chat-model=llama-3.3-70b-versatile
groq.whisper-model=whisper-large-v3-turbo
groq.max-tokens=1024
groq.temperature=0.7

# --- CORS ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Logging ---
logging.level.com.iprep=DEBUG
logging.level.org.springframework.security=WARN
